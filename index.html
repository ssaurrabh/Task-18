<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript DOM and Event Handling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <nav>
            <h1 id="head">Hello</h1>
        </nav>

        <section>
            <div class="box"><button onclick="red()" id="red">Red</button></div>
            <div class="box"><button onclick="blue()" id="blue">Blue</button></div>
            <div class="box"><button onclick="green()" id="green">Green</button></div>
            <div class="box"><button onclick="yellow()" id="yellow">Yellow</button></div>
        </section>

        <main>
            <input type="search" id="sea" placeholder="Enter to Search">
            <button onclick="show()">Greet</button>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
